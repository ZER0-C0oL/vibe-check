<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defend the Undefendable</title>
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    .statement-card {
      background: linear-gradient(135deg, #6c5ce7, #e84393);
      color: #fff;
      padding: 2rem;
      border-radius: var(--radius);
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.4s ease both;
      box-shadow: 0 8px 30px rgba(108, 92, 231, 0.3);
      position: relative;
      overflow: hidden;
    }
    .statement-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: shimmer 3s ease-in-out infinite;
    }
    .statement-card span { position: relative; z-index: 1; }
    .defender-highlight {
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      color: var(--text);
      padding: 1.5rem;
      border-radius: var(--radius);
      text-align: center;
      margin-bottom: 1.5rem;
      animation: bounceIn 0.5s ease both;
      box-shadow: 0 6px 25px rgba(253, 203, 110, 0.3);
    }
    .defender-highlight .label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
      margin-bottom: 0.25rem;
    }
    .defender-highlight .name {
      font-size: 1.8rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .defender-highlight .instruction {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .audience-section {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.4s ease 0.2s both;
    }
    .audience-section h3 { margin-bottom: 0.5rem; }
    .vote-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .vote-btn-aud {
      flex: 1;
      padding: 0.75rem;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.25s ease;
    }
    .vote-btn-aud.convinced {
      background: #d4f5dc;
      color: #00b894;
      border-color: #00b894;
    }
    .vote-btn-aud.convinced:hover, .vote-btn-aud.convinced.selected {
      background: #00b894;
      color: #fff;
      transform: translateY(-2px);
    }
    .vote-btn-aud.not-convinced {
      background: #fde0e0;
      color: #d63031;
      border-color: #d63031;
    }
    .vote-btn-aud.not-convinced:hover, .vote-btn-aud.not-convinced.selected {
      background: #d63031;
      color: #fff;
      transform: translateY(-2px);
    }
    .current-player-banner {
      background: linear-gradient(135deg, var(--accent), #fdcb6e);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: var(--radius-sm);
      text-align: center;
      font-weight: 600;
      margin-bottom: 0.75rem;
      animation: fadeInUp 0.3s ease both;
    }
    .verdict-card {
      text-align: center;
      padding: 1.5rem;
      border-radius: var(--radius);
      margin-top: 1rem;
      animation: scaleIn 0.4s ease both;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .verdict-card.convincing {
      background: linear-gradient(135deg, #d4f5dc, #00b894);
      color: #fff;
    }
    .verdict-card.not-convincing {
      background: linear-gradient(135deg, #fde0e0, #d63031);
      color: #fff;
    }
    .skip-btn {
      background: none;
      border: 2px solid rgba(108,92,231,0.3);
      color: var(--text-light);
      padding: 0.4rem 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .skip-btn:hover { border-color: var(--primary); color: var(--primary); }
    .phase1-actions {
      display: flex;
      gap: 0.75rem;
    }
    .phase1-actions .btn { flex: 1; }
  </style>
</head>
<body>
<div class="bg-orbs"></div>
  <div class="game-page">
    <div class="game-header">
      <h1>⚖️ Defend the Undefendable</h1>
      <button class="btn btn-outline btn-sm" onclick="window.location.href='../games.html'">← Back</button>
    </div>

    <!-- Phase 1: Show Statement + Defender -->
    <div id="phase1">
      <div class="statement-card" id="statementDisplay"><span>Loading...</span></div>
      <div class="defender-highlight" id="defenderCard">
        <div class="label">🎙️ Today's Defender</div>
        <div class="name" id="defenderName"></div>
        <div class="instruction">You must argue IN FAVOR of this statement. Convince the room!</div>
      </div>
      <p class="text-center mb-3" style="color: var(--text-light);">
        After the defender argues their case, the audience votes on whether they were convincing.
      </p>
      <div class="phase1-actions">
        <button class="btn btn-primary" onclick="startAudienceVote()">🗳️ Audience Vote</button>
        <button class="skip-btn" onclick="skipRound()">⏭ Skip Round</button>
      </div>
    </div>

    <!-- Phase 2: Audience Votes -->
    <div id="phase2" class="hidden">
      <div class="statement-card" id="statementReminder" style="font-size: 1rem; padding: 1.25rem;"><span></span></div>
      <div class="audience-section">
        <h3>Was <span id="defenderNameReminder"></span> convincing?</h3>
        <div class="current-player-banner" id="voterBanner"></div>
        <div class="vote-row">
          <button class="vote-btn-aud convinced" onclick="castVote('yes', this)">👏 Convinced</button>
          <button class="vote-btn-aud not-convinced" onclick="castVote('no', this)">🙅 Not Convinced</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block hidden" id="confirmBtn" onclick="confirmVote()">Lock In & Pass Device</button>
    </div>

    <!-- Phase 3: Results -->
    <div id="phase3" class="hidden">
      <div class="statement-card" id="statementResult" style="font-size: 1rem; padding: 1.25rem;"><span></span></div>
      <div id="verdictCard"></div>
      <button class="btn btn-secondary btn-block mt-3" onclick="nextRound()">🔄 Next Round</button>
      <button class="btn btn-outline btn-block mt-2" onclick="window.location.href='../games.html'">← Back to Games</button>
    </div>
  </div>

  <script src="../js/state.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/prompts.js"></script>
  <script>
    const STATEMENTS = GAME_PROMPTS['defend'];
    const participants = getParticipants();
    let currentStatement = '';
    let currentDefender = '';
    let currentVoterIndex = 0;
    let currentChoice = null;
    let votes = [];
    let usedStatements = [];
    let defenderRotation = shuffleArray([...participants]);
    let defenderIdx = 0;

    function setPhase(n) {
      [1,2,3].forEach(p => document.getElementById(`phase${p}`).classList.toggle('hidden', p !== n));
    }
    function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function pickStatement() {
      const avail = STATEMENTS.filter(s => !usedStatements.includes(s));
      if (avail.length === 0) usedStatements = [];
      const pool = avail.length > 0 ? avail : STATEMENTS;
      const pick = getRandomItem(pool);
      usedStatements.push(pick);
      return pick;
    }

    function pickDefender() {
      if (defenderIdx >= defenderRotation.length) {
        defenderRotation = shuffleArray([...participants]);
        defenderIdx = 0;
      }
      return defenderRotation[defenderIdx++].name;
    }

    function loadRound() {
      currentStatement = pickStatement();
      currentDefender = pickDefender();
      document.getElementById('statementDisplay').querySelector('span').textContent = `"${currentStatement}"`;
      document.getElementById('defenderName').textContent = currentDefender;
    }

    function skipRound() { loadRound(); }

    function startAudienceVote() {
      votes = [];
      currentVoterIndex = 0;
      currentChoice = null;
      // Skip the defender themselves
      setPhase(2);
      document.getElementById('statementReminder').querySelector('span').textContent = `"${currentStatement}"`;
      document.getElementById('defenderNameReminder').textContent = currentDefender;
      showVoter();
    }

    function showVoter() {
      // Skip the defender
      while (currentVoterIndex < participants.length && participants[currentVoterIndex].name === currentDefender) {
        currentVoterIndex++;
      }
      if (currentVoterIndex >= participants.length) { showResults(); return; }
      const player = participants[currentVoterIndex];
      document.getElementById('voterBanner').textContent = `🗳️ ${player.name}'s turn`;
      currentChoice = null;
      document.getElementById('confirmBtn').classList.add('hidden');
      document.querySelectorAll('.vote-btn-aud').forEach(b => b.classList.remove('selected'));
    }

    function castVote(choice, btn) {
      currentChoice = choice;
      document.querySelectorAll('.vote-btn-aud').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('confirmBtn').classList.remove('hidden');
    }

    function confirmVote() {
      if (!currentChoice) return;
      votes.push({ voter: participants[currentVoterIndex].name, vote: currentChoice });
      currentVoterIndex++;
      showVoter();
    }

    function showResults() {
      setPhase(3);
      document.getElementById('statementResult').querySelector('span').textContent = `"${currentStatement}"`;

      const yesCount = votes.filter(v => v.vote === 'yes').length;
      const noCount = votes.filter(v => v.vote === 'no').length;
      const total = votes.length;
      const convinced = yesCount > noCount;

      // Score: defender gets points = number of convinced votes
      const roundScores = {};
      participants.forEach(p => roundScores[p.name] = 0);
      roundScores[currentDefender] = yesCount;
      saveGameScores('defend', roundScores);

      const verdictDiv = document.getElementById('verdictCard');
      verdictDiv.innerHTML = `
        <div class="verdict-card ${convinced ? 'convincing' : 'not-convincing'}">
          ${convinced ? '🎉' : '😬'} ${escapeHTML(currentDefender)} was
          ${convinced ? 'CONVINCING!' : 'NOT convincing!'}
          <div style="font-size: 0.9rem; font-weight: 500; margin-top: 0.5rem;">
            👏 ${yesCount} convinced &nbsp;|&nbsp; 🙅 ${noCount} not convinced
          </div>
        </div>
      `;
    }

    function nextRound() {
      loadRound();
      setPhase(1);
    }

    // Init
    loadRound();
  </script>
</body>
</html>
