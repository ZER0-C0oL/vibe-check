<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Games Hub</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .home-emoji {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      animation: bounceIn 0.8s ease both;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }
    .title-display {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      min-height: 3rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInUp 0.6s ease 0.2s both;
    }
    .title-input {
      max-width: 360px;
      text-align: center;
      font-size: 1.1rem;
      animation: fadeInUp 0.6s ease 0.4s both;
    }
    .screen .btn {
      animation: fadeInUp 0.6s ease 0.6s both;
    }
    .tagline {
      color: var(--text-light);
      font-size: 0.95rem;
      animation: fadeIn 0.6s ease 0.8s both;
      margin-top: -0.5rem;
    }
  </style>
</head>
<body>
<div class="bg-orbs"></div>
  <div class="screen">
    <div class="home-emoji">🎉</div>
    <div class="title-display" id="titleDisplay">Let's Party 🎉</div>

    <input
      type="text"
      id="titleInput"
      class="title-input"
      placeholder="Enter your party name..."
      maxlength="50"
    />

    <button class="btn btn-primary btn-block" style="max-width: 360px;" onclick="startParty()">
      🚀 Start
    </button>
    <p class="tagline">Get everyone together for some fun!</p>
  </div>

  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script>
    const titleInput = document.getElementById('titleInput');
    const titleDisplay = document.getElementById('titleDisplay');

    // Load saved title
    const savedTitle = getPartyTitle();
    titleInput.value = savedTitle === "Let's Party 🎉" ? '' : savedTitle;
    titleDisplay.textContent = savedTitle;

    // Update title live as user types
    titleInput.addEventListener('input', () => {
      const val = titleInput.value.trim();
      const title = val || "Let's Party 🎉";
      titleDisplay.textContent = title;
      setPartyTitle(title);
    });

    function startParty() {
      // Ensure title is saved
      const val = titleInput.value.trim();
      if (val) setPartyTitle(val);
      navigateTo('lobby.html');
    }
  </script>
</body>
</html>
